aid: reka
name: Reka
description: >-
  Reka is a multimodal foundation model company building natively multimodal
  large language models capable of joint reasoning over text, image, video,
  and audio. The Reka model family spans Spark (1B) for embedded use cases,
  Edge (7B), Flash (21B), and Core (67B) for complex enterprise tasks. Reka
  exposes its hosted models through the Reka API at api.reka.ai with
  OpenAI-compatible chat completions, and also ships products including the
  Reka Vision Platform for enterprise perception, Reka Speech for audio
  understanding, and Reka Clip for creators. The platform supports flexible
  deployment across cloud, VPC, on-premises, and fully air-gapped
  environments, and the company maintains an active open-source presence on
  Hugging Face and GitHub including the Reka VibeEval benchmark.
